name: Build macOS app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, and sign locally
        env:
          CAMPUSQUOTA_ARCHS: arm64 x86_64
        run: zsh build.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Campus Quota.app" CampusQuota-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CampusQuota-macOS
          path: CampusQuota-macOS.zip
